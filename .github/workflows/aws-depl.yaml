name: Build and Deploy React App

on:
  push:
    branches: [master]

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Step 3: Install dependencies and build
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # Step 4: Upload build artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: react-build
          path: build/

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build # Ensure this job runs only after the build job is successful
    
    steps:
      # Step 1: Download build artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: react-build
      
      # Step 2: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Replace with your desired AWS region
      
      # Step 3: Sync files to S3 bucket
      - name: Install AWS CLI
        run: |
          sudo apt update
          sudo apt install -y awscli
      - name: Sync file to s3
        run: |
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} --acl public-read
#          run
#        with:
#          bucket: ${{ secrets.S3_BUCKET_NAME }} # Replace with your S3 bucket name
#          source-dir: build/
#          acl: public-read